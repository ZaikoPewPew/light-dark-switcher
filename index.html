<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&display=swap" rel="stylesheet">
  <style>
    /* ===== Base / Reset ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      background: #D1D8E8;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      transition: background 450ms ease;
    }

    body.dark {
      background: #252C3D;
    }

    /* ===== Layout ===== */
    .toggle-shell {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 403px;
      height: 156px;
      transform: translate(-50%, -50%) scale(0.5);
      transform-origin: center;
    }

    .toggle-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* ===== Toggle: Shared (Light + Dark) ===== */
    .toggle {
      position: relative;
      display: flex;
      width: 403px;
      padding: 12px;
      align-items: center;
      gap: 8px;
      border-radius: 600px;
      clip-path: inset(0 round 600px);
      background: #2f8bde;
      box-shadow:
        -4.481px -4.481px 10px 0 rgba(0, 0, 0, 0.25) inset,
        4.481px 8.962px 10px 0 rgba(0, 0, 0, 0.25) inset;
      cursor: pointer;
      overflow: hidden;
      transition: background 450ms ease, box-shadow 450ms ease;
      user-select: none;
      z-index: 1;
    }

    .thumb {
      position: relative;
      width: 132px;
      height: 132px;
      flex: 0 0 auto;
      transition: transform 550ms cubic-bezier(0.2, 0.9, 0.2, 1);
      z-index: 5;
    }

    .sun {
      position: absolute;
      left: -12px;
      top: 0;
      width: 144px;
      height: 144px;
      display: block;
      object-fit: fill;
      transform: none;
      z-index: 7;
      transition: transform 450ms ease, opacity 450ms ease;
    }

    .beam-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 309px;
      height: 156px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      transition: opacity 450ms ease, transform 450ms ease;
    }

    .beam-wrap-dark {
      position: absolute;
      left: 57px;
      top: 72px;
      width: 309px;
      height: 156px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 450ms ease, transform 450ms ease;
    }

    .beam {
      position: absolute;
      left: 50%;
      top: 50%;
      opacity: 0.4;
    }

    .beam-light {
      transform: translate(-50%, -50%);
    }

    .beam-dark {
      transform: translate(-50%, -50%);
    }

    .beam-senior {
      width: 370.8px;
      height: auto;
      z-index: 1;
      opacity: 0.4;
    }

    .beam-middle {
      width: 230.4px;
      height: auto;
      z-index: 2;
      opacity: 0.4;
    }

    .beam-junior {
      width: 301.2px;
      height: auto;
      z-index: 3;
      opacity: 0.4;
    }

    .cloud-wrap {
      position: absolute;
      left: 50%;
      top: 72%;
      width: 500px;
      height: 229px;
      transform: translate(calc(-43% + 64px), -53%);
      pointer-events: none;
      z-index: 2;
      transition: opacity 450ms ease, transform 450ms ease;
    }

    .cloud {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 500px;
      height: 229px;
      transform: translate(-50%, -50%);
    }

    .cloud-junior {
      z-index: 1;
      animation: drift-junior 11s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .cloud-senior {
      z-index: 2;
      animation: drift-senior 13s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    .sky-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
    }

    .moon {
      position: absolute;
      width: 150px;
      height: 144px;
      left: -18px;
      top: 0;
      display: block;
      object-fit: fill;
      transform-origin: center;
      z-index: 7;
      opacity: 0;
      transform: scale(0.85);
      transition: transform 850ms cubic-bezier(0.2, 0.9, 0.2, 1), opacity 350ms ease;
    }

    .stars-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 350ms ease;
    }

    .star-group-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .star-group-svg path {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: star-group-twinkle 2.8s ease-in-out infinite;
    }

    .star-group-svg path:nth-of-type(1) { animation-delay: 0.1s; animation-duration: 2.4s; }
    .star-group-svg path:nth-of-type(2) { animation-delay: 0.9s; animation-duration: 3.0s; }
    .star-group-svg path:nth-of-type(3) { animation-delay: 0.4s; animation-duration: 2.6s; }
    .star-group-svg path:nth-of-type(4) { animation-delay: 1.2s; animation-duration: 3.2s; }
    .star-group-svg path:nth-of-type(5) { animation-delay: 0.2s; animation-duration: 2.7s; }
    .star-group-svg path:nth-of-type(6) { animation-delay: 1.0s; animation-duration: 3.1s; }
    .star-group-svg path:nth-of-type(7) { animation-delay: 0.6s; animation-duration: 2.5s; }
    .star-group-svg path:nth-of-type(8) { animation-delay: 1.4s; animation-duration: 3.3s; }
    .star-group-svg path:nth-of-type(9) { animation-delay: 0.3s; animation-duration: 2.9s; }
    .star-group-svg path:nth-of-type(10) { animation-delay: 1.1s; animation-duration: 3.4s; }

    .star-group-svg path:nth-of-type(3n) {
      animation-name: star-group-twinkle-soft;
    }

    /* ===== Theme: Dark Overrides ===== */
    .toggle-input:checked + .toggle {
      background: #031221;
      box-shadow:
        -4.481px -4.481px 10px 0 rgba(48, 66, 86, 0.25) inset,
        4.481px 8.962px 10px 0 rgba(0, 0, 0, 0.28) inset;
    }

    .toggle-input:checked + .toggle .thumb {
      transform: translateX(247px);
    }

    .toggle-input:checked + .toggle .cloud-wrap {
      opacity: 0;
      transform: translate(calc(-43% + 64px), -45%) scale(0.88);
    }

    .toggle-input:checked + .toggle .beam-wrap {
      opacity: 0;
    }

    .toggle-input:checked + .toggle .beam-wrap-dark {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .toggle-input:checked + .toggle .sun {
      opacity: 0;
      transform: scale(0.88);
    }

    .toggle-input:checked + .toggle .beam-senior {
      opacity: 0.4;
    }

    .toggle-input:checked + .toggle .beam-middle {
      opacity: 0.4;
    }

    .toggle-input:checked + .toggle .beam-junior {
      opacity: 0.4;
    }

    .toggle-input:checked + .toggle .moon {
      opacity: 1;
      transform: scale(1);
    }

    .toggle-input:checked + .toggle .stars-layer {
      opacity: 1;
    }


    @keyframes drift-junior {
      0%, 100% { transform: translate(-50%, -50%) translateX(-6px) translateY(0); }
      50% { transform: translate(-50%, -50%) translateX(10px) translateY(-3px); }
    }

    @keyframes drift-senior {
      0%, 100% { transform: translate(-50%, -50%) translateX(5px) translateY(-1px); }
      50% { transform: translate(-50%, -50%) translateX(-9px) translateY(2px); }
    }

    @keyframes star-group-twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.82); }
      35% { opacity: 0.95; transform: scale(1.06); }
      65% { opacity: 0.45; transform: scale(0.92); }
    }

    @keyframes star-group-twinkle-soft {
      0%, 100% { opacity: 0.18; transform: scale(0.86); }
      50% { opacity: 0.78; transform: scale(1); }
    }

    /* ===== Footer Telegram ===== */
    .footer-telegram {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 100;
      padding-bottom: 24px;
      font-family: "Montserrat", sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: #000;
      text-align: center;
      transition: color 450ms ease;
    }

    body.dark .footer-telegram {
      color: #fff;
    }

    .footer-telegram a {
      color: inherit;
      text-decoration: none;
    }

    .footer-telegram a:hover {
      text-decoration: underline;
    }

    @media (min-width: 768px) {
      .footer-telegram {
        padding-bottom: 40px;
      }
    }

  </style>
</head>
<body>
  <!-- ===== Theme Toggle Widget ===== -->
  <div class="toggle-shell">
    <input id="theme-toggle" class="toggle-input" type="checkbox" aria-label="Переключатель темы">
    <label class="toggle" for="theme-toggle">
      <!-- Thumb: Celestial Layers -->
      <div class="thumb" aria-hidden="true">
        <!-- Sun rays -->
        <div class="beam-wrap">

          <img src="beam/Middle.svg" alt="" class="beam beam-light beam-middle">
          <img src="beam/Junior.svg" alt="" class="beam beam-light beam-junior">
        </div>

        <!-- Moon rays (dark only) -->
        <div class="beam-wrap-dark">
          <img src="beam/Senior.svg" alt="" class="beam beam-dark beam-senior">
          <img src="beam/Middle.svg" alt="" class="beam beam-dark beam-middle">
          <img src="beam/Junior.svg" alt="" class="beam beam-dark beam-junior">
        </div>

        <!-- Clouds -->
        <div class="cloud-wrap">
          <img src="clouds/Junior.svg" alt="" class="cloud cloud-junior">
          <img src="clouds/Senior.svg" alt="" class="cloud cloud-senior">

        <img src="Sun.svg" alt="" class="sun">

        </div>
      </div>
    </label>
  </div>

  <!-- Audio feedback (desktop only; mobile uses haptics) -->
  <audio id="click-sound" preload="auto">
    <source src="audio.wav" type="audio/wav">
  </audio>

  <p class="footer-telegram">
    <a href="https://telegram.me/dsgn_thinking" target="_blank" rel="noopener noreferrer">telegram.me/dsgn_thinking</a>
  </p>

  <!-- ===== Theme Logic ===== -->
  <script>
    // --- DOM refs ---
    const toggle = document.getElementById("theme-toggle");
    const toggleLabel = document.querySelector('label[for="theme-toggle"]');
    const clickSound = document.getElementById("click-sound");
    if (clickSound) {
      clickSound.volume = 0.25;
    }

    // --- Theme application ---
    function applyLightTheme() {
      document.body.classList.remove("dark");
    }

    function applyDarkTheme() {
      document.body.classList.add("dark");
    }

    function applyThemeState(isDark) {
      if (isDark) {
        applyDarkTheme();
        return;
      }
      applyLightTheme();
    }

    function isMobileInteractionContext() {
      return window.matchMedia("(pointer: coarse)").matches;
    }

    /** Haptics must run synchronously inside a user gesture (pointerdown), not on "change". */
    function triggerTouchHapticFromPointerEvent(event) {
      if (event.pointerType !== "touch" && event.pointerType !== "pen") {
        return;
      }
      if (typeof navigator.vibrate !== "function") {
        return;
      }
      navigator.vibrate(40);
    }

    function playClickFeedback() {
      if (clickSound && !isMobileInteractionContext()) {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => {});
      }
    }

    if (toggleLabel) {
      toggleLabel.addEventListener("pointerdown", triggerTouchHapticFromPointerEvent, {
        passive: true,
      });
    }

    function setTheme(isDark) {
      if (toggle.checked === isDark) {
        return;
      }
      toggle.checked = isDark;
      playClickFeedback();
      applyThemeState(toggle.checked);
    }

    // --- Events ---
    toggle.addEventListener("change", () => {
      playClickFeedback();
      applyThemeState(toggle.checked);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        setTheme(true);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        setTheme(false);
      }
    });

    // Sync initial state if checkbox is pre-checked
    applyThemeState(toggle.checked);
  </script>
</body>
</html>
